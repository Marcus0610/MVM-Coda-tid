function renderMenu(){const q=document.getElementById('modelSearch').value.toLowerCase();menu.innerHTML=models.filter(m=>m.toLowerCase().includes(q)).map(m=>`<button class="${m===selected?'active':''}" data-model="${esc(m)}"><strong>${esc(m)}</strong><span class="pill">${Object.values(DATA[m]).reduce((a,r)=>a+r.length,0)}</span></button>`).join('')+(q?'':`<button class="${selected==='__info__'?'active':''}" data-model="__info__"><span>ℹ️ Info</span></button>`);if(!menu.innerHTML)menu.innerHTML='<p class="muted">Ingen modeller fundet</p>';menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.model;document.getElementById('presetSearch').value='';document.getElementById('sidebar').classList.remove('open');renderMenu();renderContent()})}
function fullPreset(model,group,preset){
  // Vis både højttalerens preset og den tilhørende SUB-preset.
  let speaker=model, sub=group, mode='', subPreset=preset;
  if(model==='APS-Pro'){
    if(preset.startsWith('Arrayed D/S >> ')){speaker+=' Arrayed D/S >>';subPreset=preset.slice(15)}
    else if(preset.startsWith('Single / Horizontal >> ')){speaker+=' Single / Horizontal >>';subPreset=preset.slice(23)}
  } else if(model==='N-APS'){
    const m=preset.match(/^(Crossover(?: >| >>)?) \+ (.+)$/);
    if(m){speaker+=' '+m[1];subPreset=m[2]}
  } else if(model==='HOPS12-PRO + Crossover'){
    speaker='HOPS12-Crossover';
  } else if(model==='HOPS12-PRO'){
    speaker='HOPS12-Fullrange';
  } else if(model==='HOPS10-PRO'){
    speaker='HOPS10';
  } else if(model==='HOPS8'){
    speaker='HOPS8-Crossover >';
  } else if(model==='G712-A'){
    speaker='G712-A Crossover >';
  }
  if(model==='HOPS12-PRO + Crossover'||model==='HOPS12-PRO'||model==='HOPS10-PRO'){
    const m=subPreset.match(/^(Crossover|Fullrange)(?: (>>|>))? \+ (.+)$/);
    if(m){speaker=(model==='HOPS10-PRO'?'HOPS10-':'HOPS12-')+m[1]+(m[2]?' '+m[2]:'');subPreset=m[3]}
  }
  if(subPreset.startsWith('>> ')){speaker+=' >>';subPreset=subPreset.slice(3)}
  else if(subPreset.startsWith('> ')){speaker+=' >';subPreset=subPreset.slice(2)}
  if(group==='SC2 >>' || group==='SCN >>'){
    speaker=speaker.replace(/ >>$/,'')+' >>';sub=group;subPreset='';
  }
  if(group==='SCN Cardio X' && subPreset==='SCN Cardio X'){sub='SCN';subPreset='Cardio X'}
  if(group==='APS-SUB' && subPreset==='APS-SUB')subPreset='';
  if(group==='N-SUB' && subPreset==='Omni100')subPreset='Omni100';
  if(group==='SCN-F' && subPreset.startsWith('SCN SUB '))subPreset=subPreset.slice(8);
  return '['+speaker+'] + ['+sub+(subPreset?' '+subPreset:'')+']';
}

on>`}).join('');if(!shown)content.innerHTML='<div class="empty">Ingen presets matcher din søgning.</div>'}
